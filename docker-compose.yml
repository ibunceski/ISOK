services:

  # ── Laravel PHP application ─────────────────────────────────────────────────
  app:
    build:
      context: ./php-app/youth-platform-app
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-80}:8080"
    environment:
      # Application
      APP_NAME: "Youth Safety Platform"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"

      # Logging — stderr sends everything to `docker logs`, no files needed
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      # Database — host must match the service name below, not 127.0.0.1
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      # Drivers (file-based; good enough for a single-container deployment)
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      BROADCAST_DRIVER: log

      # AI service — use the Docker service name, not localhost
      AI_ANALYZE_URL: "http://ai-service:8000/analyze"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate --force
      && php artisan db:seed --class=AdminSeeder --force
      && php artisan storage:link 2>/dev/null || true
      && php artisan package:discover --ansi
      && php artisan serve --host=0.0.0.0 --port=8080"
    volumes:
      # Persist user-uploaded files across container restarts
      - storage_data:/var/www/html/storage/app/public
    networks:
      - app-network
    restart: unless-stopped

  # ── Python / FastAPI AI service ─────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      # Exposed on the host for direct testing; the app uses the internal port
      - "${AI_PORT:-8001}:8000"
    networks:
      - app-network
    restart: unless-stopped
    # The HuggingFace model is downloaded on first request and cached here so
    # subsequent restarts don't re-download it (~500 MB)
    volumes:
      - huggingface_cache:/root/.cache/huggingface

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Optional: expose so you can connect with a local DB client
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      # $$VAR syntax: $$ is escaped to a literal $ so docker-compose does not
      # interpolate it — the shell inside the container expands it instead.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  storage_data:
  huggingface_cache:

# ── Internal network ─────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
